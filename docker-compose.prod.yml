version: "3.9"

# Used on the EC2 host. Unlike docker-compose.yml (local dev, builds
# the image from source), this pulls the image the CI/CD pipeline
# already built and pushed to Docker Hub — set DOCKERHUB_IMAGE in the
# EC2 box's .env (e.g. yourusername/metroflow-backend:latest). Docker
# Hub instead of ECR keeps image storage free with no size cap.
# Run with:
#   docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: metroflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: metroflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metroflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKERHUB_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "80:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://metroflow:${POSTGRES_PASSWORD}@db:5432/metroflow
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-2}"

volumes:
  pgdata:
